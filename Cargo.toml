[package]
name = "rsh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
getrandom = "0.3"
hostname = "0.4"
rustls-pemfile = "2"
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
toml = "1"
webpki-roots = "1"
